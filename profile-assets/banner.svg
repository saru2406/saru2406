<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/fontsource/fonts/maple-mono@latest/latin-400-normal.woff2');
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;display=swap');

      .mono {
        font-family: 'Maple Mono', 'Maple Mono NF', 'Fira Code', 'JetBrains Mono', 'Cascadia Code', monospace;
      }
      .title { font-size: 13px; fill: #a6adc8; font-weight: 500; }
      .prompt-user { fill: #a6e3a1; font-weight: 600; font-size: 14px; }
      .prompt-at { fill: #6c7086; font-size: 14px; }
      .prompt-host { fill: #89b4fa; font-weight: 600; font-size: 14px; }
      .prompt-sep { fill: #6c7086; font-size: 14px; }
      .prompt-dir { fill: #b4befe; font-weight: 600; font-size: 14px; }
      .prompt-arrow { fill: #cba6f7; font-weight: 700; font-size: 15px; }
      .prompt-cmd { fill: #cdd6f4; font-size: 14px; }
      
      .key { fill: #cba6f7; font-weight: 600; font-size: 13.5px; }
      .colon { fill: #6c7086; font-size: 13.5px; }
      .val { fill: #cdd6f4; font-size: 13.5px; }
      .val-accent { fill: #89dceb; font-size: 13.5px; }
      .val-highlight { fill: #fab387; font-size: 13.5px; }
      .comment { fill: #6c7086; font-style: italic; font-size: 13px; }
    </style>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#1e1e2e" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#45475a" />
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#45475a" />
    </linearGradient>
  </defs>

  <!-- Background Window Card -->
  <rect x="1.5" y="1.5" width="847" height="247" rx="14" fill="url(#bg-grad)" stroke="url(#card-border)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <path d="M 1.5 15.5 A 14 14 0 0 1 15.5 1.5 L 834.5 1.5 A 14 14 0 0 1 848.5 15.5 L 848.5 42 L 1.5 42 Z" fill="#11111b" />
  <line x1="1.5" y1="42" x2="848.5" y2="42" stroke="#313244" stroke-width="1" />

  <!-- Terminal Window Controls (Mocha Palette) -->
  <circle cx="24" cy="22" r="6" fill="#f38ba8" />
  <circle cx="44" cy="22" r="6" fill="#f9e2af" />
  <circle cx="64" cy="22" r="6" fill="#a6e3a1" />

  <!-- Header Title -->
  <text class="mono title" x="425" y="26" text-anchor="middle">saru@archlinux:~ (catppuccin mocha • maple mono)</text>

  <!-- Terminal Prompt Line -->
  <g transform="translate(28, 72)">
    <text class="mono prompt-user" x="0" y="0">saru</text>
    <text class="mono prompt-at" x="38" y="0">@</text>
    <text class="mono prompt-host" x="50" y="0">archlinux</text>
    <text class="mono prompt-sep" x="135" y="0">:</text>
    <text class="mono prompt-dir" x="145" y="0">~</text>
    <text class="mono prompt-arrow" x="160" y="0">❯</text>
    <text class="mono prompt-cmd" x="180" y="0">fastfetch --profile minimalist</text>
  </g>

  <!-- Info Grid / Key-Values -->
  <g transform="translate(28, 106)">
    <!-- Line 1: Identity -->
    <text class="mono key" x="0" y="0">user</text>
    <text class="mono colon" x="90" y="0">::</text>
    <text class="mono val" x="115" y="0">Saravanan (Saru)</text>
    <text class="mono comment" x="270" y="0">// 18 y/o developer &amp; 3D creator</text>

    <!-- Line 2: OS & WM -->
    <text class="mono key" x="0" y="26">environment</text>
    <text class="mono colon" x="90" y="26">::</text>
    <text class="mono val-accent" x="115" y="26">Arch Linux x86_64</text>
    <text class="mono val" x="275" y="26">[ Hyprland / Wayland + Kitty + Neovim ]</text>

    <!-- Line 3: Tech Stack -->
    <text class="mono key" x="0" y="52">tech_stack</text>
    <text class="mono colon" x="90" y="52">::</text>
    <text class="mono val" x="115" y="52">Rust, C, Python, TypeScript, Godot 4, Blender 3D</text>

    <!-- Line 4: Focus -->
    <text class="mono key" x="0" y="78">interests</text>
    <text class="mono colon" x="90" y="78">::</text>
    <text class="mono val-highlight" x="115" y="78">Low-Level Systems Programming • Game Engine Architecture • 3D Shaders</text>

    <!-- Line 5: Location & Mission -->
    <text class="mono key" x="0" y="104">location</text>
    <text class="mono colon" x="90" y="104">::</text>
    <text class="mono val" x="115" y="104">Pondicherry, India 🇮🇳</text>
    <text class="mono comment" x="310" y="104">"simplicity is prerequisite for reliability"</text>
  </g>
</svg>
