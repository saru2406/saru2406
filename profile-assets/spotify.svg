<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 160" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0e" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <linearGradient id="progressBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1db954" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glowSpotify" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .mono { font-family: 'Maple Mono', 'Cascadia Code', 'JetBrains Mono', monospace; }
      
      @keyframes eq1 { 0%, 100% { height: 6px; } 50% { height: 26px; } }
      @keyframes eq2 { 0%, 100% { height: 24px; } 50% { height: 8px; } }
      @keyframes eq3 { 0%, 100% { height: 10px; } 50% { height: 28px; } }
      @keyframes eq4 { 0%, 100% { height: 28px; } 50% { height: 12px; } }
      @keyframes eq5 { 0%, 100% { height: 14px; } 50% { height: 22px; } }

      @keyframes progressSweep {
        0% { width: 40px; }
        50% { width: 220px; }
        100% { width: 40px; }
      }

      .bar-1 { animation: eq1 1.2s ease-in-out infinite; }
      .bar-2 { animation: eq2 0.9s ease-in-out infinite 0.1s; }
      .bar-3 { animation: eq3 1.4s ease-in-out infinite 0.25s; }
      .bar-4 { animation: eq4 1.1s ease-in-out infinite 0.15s; }
      .bar-5 { animation: eq5 0.8s ease-in-out infinite 0.3s; }
      .progress-track { animation: progressSweep 12s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="1" y="1" width="408" height="158" rx="16" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.2" />

  <!-- Top Bar: Spotify Logo & Playing status -->
  <g transform="translate(20, 18)">
    <!-- Spotify Icon -->
    <path d="M 12 2 C 6.5 2, 2 6.5, 2 12 C 2 17.5, 6.5 22, 12 22 C 17.5 22, 22 17.5, 22 12 C 22 6.5, 17.5 2, 12 2 Z M 16.6 16.4 C 16.4 16.7, 16 16.8, 15.7 16.6 C 13.1 15, 9.7 14.6, 5.7 15.5 C 5.3 15.6, 5 15.3, 4.9 15 C 4.8 14.6, 5.1 14.3, 5.4 14.2 C 9.8 13.2, 13.6 13.7, 16.4 15.4 C 16.7 15.6, 16.8 16, 16.6 16.4 Z M 17.8 13.3 C 17.5 13.7, 17 13.8, 16.6 13.6 C 13.6 11.7, 9 11.2, 5.4 12.3 C 5 12.4, 4.5 12.2, 4.4 11.7 C 4.3 11.3, 4.5 10.8, 5 10.7 C 9.2 9.4, 14.2 10, 17.6 12.1 C 18 12.3, 18.1 12.9, 17.8 13.3 Z M 18 10.1 C 14.4 7.9, 8.3 7.7, 4.8 8.8 C 4.3 9, 3.7 8.6, 3.5 8.1 C 3.4 7.5, 3.7 7, 4.3 6.8 C 8.4 5.6, 15.1 5.8, 19.3 8.3 C 19.8 8.6, 20 9.2, 19.7 9.7 C 19.4 10.1, 18.8 10.3, 18 10.1 Z" fill="#1db954" filter="url(#glowSpotify)" />
    
    <text x="28" y="16" fill="#1db954" font-size="11" font-weight="700" class="mono" letter-spacing="1">SPOTIFY • NOW VIBING</text>
    
    <!-- Animated Equalizer Bars -->
    <g transform="translate(325, 18) scale(1, -1)" fill="#1db954">
      <rect class="bar-1" x="0" y="0" width="3" height="12" rx="1.5" />
      <rect class="bar-2" x="6" y="0" width="3" height="20" rx="1.5" />
      <rect class="bar-3" x="12" y="0" width="3" height="16" rx="1.5" />
      <rect class="bar-4" x="18" y="0" width="3" height="24" rx="1.5" />
      <rect class="bar-5" x="24" y="0" width="3" height="14" rx="1.5" />
    </g>
  </g>

  <!-- Album Art & Song Details -->
  <g transform="translate(20, 52)">
    <!-- Vinyl / Album Cover Placeholder -->
    <rect width="48" height="48" rx="10" fill="#1a1a20" stroke="#ffffff" stroke-opacity="0.1" />
    <!-- Music note / Disc glyph -->
    <circle cx="24" cy="24" r="14" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 2" />
    <circle cx="24" cy="24" r="5" fill="#38bdf8" />

    <!-- Text Info -->
    <text x="60" y="18" fill="#ffffff" font-size="14" font-weight="700" class="mono">Midnight Tokyo Drift</text>
    <text x="60" y="34" fill="#a1a1aa" font-size="11" font-weight="500" class="mono">Saru x Synthwave • Neon Memories</text>

    <!-- Track duration progress bar -->
    <g transform="translate(60, 42)">
      <!-- Background Track -->
      <rect width="305" height="4" rx="2" fill="#ffffff" fill-opacity="0.1" />
      <!-- Animated Active Track -->
      <rect class="progress-track" width="180" height="4" rx="2" fill="url(#progressBar)" />
    </g>
  </g>

  <!-- Timestamp row -->
  <g transform="translate(80, 115)">
    <text x="0" y="0" fill="#71717a" font-size="9" class="mono">01:42</text>
    <text x="286" y="0" fill="#71717a" font-size="9" class="mono">03:04</text>
  </g>

  <!-- Subtle bottom tag -->
  <g transform="translate(20, 138)">
    <rect width="84" height="16" rx="8" fill="#ffffff" fill-opacity="0.05" />
    <text x="10" y="11.5" fill="#a1a1aa" font-size="9" class="mono">Synthwave / Lo-Fi</text>
    
    <text x="100" y="11.5" fill="#52525b" font-size="9" class="mono">BPM: 86 • Key: Am</text>
  </g>
</svg>
